name: Plugin checks

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/**'
      - 'tools/verify/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and check loot stack regression
        run: bash gradlew clean build
