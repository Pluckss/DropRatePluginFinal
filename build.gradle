plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.pluckss.droprate.DropRateDevLauncher'
def devSessionFile = (findProperty('runeliteSessionFile') ?: rootProject.file('.runelite-dev-session').absolutePath).toString()
def devUserHome = (findProperty('runeliteDevHome') ?: rootProject.file('.runelite-dev-home').absolutePath).toString()

configurations {
	// Keep RuneLite only on the local dev launcher classpath so Plugin Hub does not bundle it.
	devRuntime
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion
	devRuntime group: 'net.runelite', name:'client', version: runeLiteVersion
	devRuntime group: 'net.runelite', name:'jshell', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.pluckss'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.withType(AbstractCopyTask).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/LICENSE'
	exclude 'META-INF/LICENSE.txt'
	exclude 'META-INF/NOTICE'
	exclude 'META-INF/NOTICE.txt'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath + configurations.devRuntime
	mainClass = pluginMainClass

	jvmArgs "-ea"
	systemProperty "user.home", devUserHome
	args "--developer-mode", "--debug"
	if (devSessionFile) {
		args "--sessionfile", devSessionFile.toString()
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.devRuntime
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	from sourceSets.main.output
	from {
		configurations.devRuntime.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
